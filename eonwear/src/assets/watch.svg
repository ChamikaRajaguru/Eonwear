<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="watchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Watch Body Shadow -->
  <ellipse cx="200" cy="210" rx="140" ry="145" fill="#000000" opacity="0.3" filter="url(#shadow)" />

  <!-- Watch Case Outer Ring -->
  <circle cx="200" cy="200" r="140" fill="url(#watchGradient)" stroke="#888888" stroke-width="2" />

  <!-- Watch Case Inner Dark Ring -->
  <circle cx="200" cy="200" r="135" fill="#1a1a1a" stroke="#666666" stroke-width="1" />

  <!-- Watch Face -->
  <circle cx="200" cy="200" r="125" fill="url(#faceGradient)" stroke="#d4a574" stroke-width="2" />

  <!-- Watch Face Border Detail -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#444444" stroke-width="0.5" />

  <!-- Hour Markers -->
  <!-- 12 o'clock -->
  <rect x="197" y="85" width="6" height="20" fill="#d4a574" rx="3" />
  <!-- 3 o'clock -->
  <rect x="315" y="197" width="20" height="6" fill="#d4a574" rx="3" />
  <!-- 6 o'clock -->
  <rect x="197" y="295" width="6" height="20" fill="#d4a574" rx="3" />
  <!-- 9 o'clock -->
  <rect x="85" y="197" width="20" height="6" fill="#d4a574" rx="3" />

  <!-- Minute Markers -->
  <!-- 1 o'clock -->
  <rect x="270" y="95" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(30 272 102.5)" />
  <!-- 2 o'clock -->
  <rect x="295" y="120" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(60 297 127.5)" />
  <!-- 4 o'clock -->
  <rect x="305" y="270" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(-60 307 277.5)" />
  <!-- 5 o'clock -->
  <rect x="280" y="295" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(-30 282 302.5)" />
  <!-- 7 o'clock -->
  <rect x="120" y="305" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(30 122 312.5)" />
  <!-- 8 o'clock -->
  <rect x="95" y="280" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(60 97 287.5)" />
  <!-- 10 o'clock -->
  <rect x="105" y="130" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(-60 107 137.5)" />
  <!-- 11 o'clock -->
  <rect x="130" y="105" width="4" height="15" fill="#cccccc" rx="2" transform="rotate(-30 132 112.5)" />

  <!-- Center Dot -->
  <circle cx="200" cy="200" r="8" fill="#d4a574" stroke="#cccccc" stroke-width="1" />

  <!-- Hour Hand (pointing to 10) -->
  <line x1="200" y1="200" x2="160" y2="145" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />

  <!-- Minute Hand (pointing to 2) -->
  <line x1="200" y1="200" x2="270" y2="130" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" />

  <!-- Second Hand -->
  <line x1="200" y1="200" x2="200" y2="110" stroke="#d4a574" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Sub-dial at 6 o'clock position -->
  <circle cx="200" cy="280" r="20" fill="none" stroke="#666666" stroke-width="1" />
  <circle cx="200" cy="280" r="18" fill="#1a1a1a" opacity="0.5" />
  <line x1="200" y1="268" x2="200" y2="275" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round" />

  <!-- Watch Band Attachment Left -->
  <rect x="95" y="150" width="15" height="100" fill="#333333" rx="2" />
  <rect x="92" y="155" width="6" height="90" fill="#555555" rx="1" />

  <!-- Watch Band Left -->
  <path d="M 95 150 Q 60 140 50 100 L 50 300 Q 60 260 95 250 Z" fill="#1a1a1a" stroke="#222222" stroke-width="1" />
  <path d="M 50 100 Q 45 90 48 75 L 48 325 Q 45 310 50 300 Z" fill="#0a0a0a" opacity="0.6" />

  <!-- Watch Band Attachment Right -->
  <rect x="290" y="150" width="15" height="100" fill="#333333" rx="2" />
  <rect x="302" y="155" width="6" height="90" fill="#555555" rx="1" />

  <!-- Watch Band Right -->
  <path d="M 305 150 Q 340 140 350 100 L 350 300 Q 340 260 305 250 Z" fill="#1a1a1a" stroke="#222222" stroke-width="1" />
  <path d="M 350 100 Q 355 90 352 75 L 352 325 Q 355 310 350 300 Z" fill="#0a0a0a" opacity="0.6" />

  <!-- Watch Crown -->
  <rect x="340" y="195" width="20" height="10" fill="#666666" stroke="#444444" stroke-width="1" rx="2" />
  <rect x="342" y="197" width="4" height="6" fill="#888888" rx="1" />
  <rect x="350" y="197" width="4" height="6" fill="#888888" rx="1" />

  <!-- Highlight on Watch Case -->
  <ellipse cx="160" cy="140" rx="30" ry="35" fill="#ffffff" opacity="0.15" />

  <!-- Brand Text -->
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d4a574" text-anchor="middle">EONWEAR</text>
</svg>
